<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cardápio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0A0A0A;--surface:#141414;--card:#1C1C1C;
  --border:rgba(255,255,255,.07);
  --primary:#FF5722;--primary-dim:rgba(255,87,34,.12);--primary-glow:rgba(255,87,34,.25);
  --accent:#FFD600;--text:#F5F0EB;--muted:#777;
  --radius:16px;--radius-sm:10px;--radius-xs:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
h1,h2,h3,.fd{font-family:'Syne',sans-serif}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:4px}
#hdr{position:sticky;top:0;z-index:90;background:rgba(10,10,10,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
#hdr-logo{display:flex;align-items:center;gap:10px;min-width:0}
#hdr-icon{width:36px;height:36px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 4px 16px var(--primary-glow)}
#hdr-name{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cart-btn{position:relative;background:var(--primary);border:none;border-radius:var(--radius-sm);padding:10px 18px;color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;flex-shrink:0;box-shadow:0 4px 20px var(--primary-glow);transition:all .2s}
#cart-btn:hover{transform:translateY(-1px);box-shadow:0 8px 28px var(--primary-glow)}
#cart-count{background:#fff;color:var(--primary);font-size:10px;font-weight:900;border-radius:999px;padding:1px 6px;min-width:18px;text-align:center;display:none;font-family:'Syne',sans-serif}
#hero{padding:48px 24px 36px;text-align:center;position:relative;overflow:hidden}
#hero::before{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:600px;height:300px;background:radial-gradient(ellipse,rgba(255,87,34,.18) 0%,transparent 70%);pointer-events:none}
#hero-emoji{font-size:52px;margin-bottom:12px;display:block;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#hero h1{font-size:clamp(28px,6vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-bottom:10px;position:relative}
#hero-desc{color:var(--muted);font-size:15px;position:relative;margin-bottom:20px}
.hero-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:6px 16px;font-size:12px;font-weight:600;color:var(--muted)}
#cat-wrap{position:sticky;top:64px;z-index:80;background:rgba(10,10,10,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 24px}
#cat-bar{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
#cat-bar::-webkit-scrollbar{display:none}
.cat-pill{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'Syne',sans-serif;font-weight:600;font-size:12px;transition:all .2s;white-space:nowrap}
.cat-pill:hover{border-color:rgba(255,87,34,.4);color:var(--text)}
.cat-pill.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 16px var(--primary-glow)}
#prod-wrap{padding:28px 24px 140px}
.section-label{font-family:'Syne',sans-serif;font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 18px;display:flex;align-items:center;gap:12px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
#prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.prod-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .28s cubic-bezier(.4,0,.2,1);position:relative}
.prod-card:hover{transform:translateY(-6px);border-color:rgba(255,87,34,.3);box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,87,34,.15)}
.prod-img-wrap{width:100%;height:180px;position:relative;overflow:hidden;background:var(--surface)}
.prod-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.prod-card:hover .prod-img-wrap img{transform:scale(1.08)}
.prod-img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,#1a1a1a,#222)}
.prod-img-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.1) 50%,transparent 100%)}
.prod-badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.prod-badge-offer{background:var(--accent);color:#111;font-family:'Syne',sans-serif;font-weight:800;font-size:10px;padding:3px 10px;border-radius:999px}
.prod-badge-dest{background:rgba(255,255,255,.15);backdrop-filter:blur(6px);color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:10px;padding:3px 10px;border-radius:999px}
.prod-price-area{position:absolute;bottom:12px;right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.prod-price-old{font-size:11px;font-weight:600;color:rgba(255,255,255,.5);text-decoration:line-through}
.prod-price-new{background:var(--primary);color:#fff;font-family:'Syne',sans-serif;font-weight:800;font-size:14px;padding:4px 12px;border-radius:999px;box-shadow:0 4px 12px var(--primary-glow)}
.prod-body{padding:16px}
.prod-name{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-desc{color:var(--muted);font-size:12px;line-height:1.6;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod-footer{display:flex;align-items:center;justify-content:space-between}
.prod-delivery{font-size:11px;color:var(--muted)}
.prod-delivery.free{color:#4ade80;font-weight:600}
.prod-add-btn{background:var(--primary-dim);border:1px solid rgba(255,87,34,.2);border-radius:var(--radius-xs);padding:7px 14px;color:var(--primary);font-family:'Syne',sans-serif;font-weight:700;font-size:12px;cursor:pointer;transition:all .2s}
.prod-add-btn:hover{background:var(--primary);color:#fff;box-shadow:0 4px 14px var(--primary-glow)}
#cart-fab-mobile{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;background:var(--primary);border:none;border-radius:999px;padding:14px 28px;color:#fff;font-family:'Syne',sans-serif;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 8px 32px var(--primary-glow);align-items:center;gap:10px;transition:all .2s;white-space:nowrap;display:none}
#cart-fab-mobile.visible{display:flex}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:500;padding:16px;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--surface);border:1px solid rgba(255,255,255,.1);border-radius:20px;width:100%;max-width:520px;max-height:90dvh;overflow-y:auto;display:flex;flex-direction:column;animation:slideup .25s cubic-bezier(.4,0,.2,1);box-shadow:0 32px 80px rgba(0,0,0,.7)}
@keyframes slideup{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);border-radius:20px 20px 0 0;z-index:1}
.modal-title{font-family:'Syne',sans-serif;font-weight:800;font-size:18px}
.modal-close{width:32px;height:32px;background:var(--card);border:none;border-radius:8px;color:var(--muted);cursor:pointer;font-size:14px;transition:all .15s;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:rgba(255,255,255,.1);color:var(--text)}
.modal-body{padding:20px 24px;flex:1}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface);border-radius:0 0 20px 20px}
.cart-empty-state{text-align:center;padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.cart-empty-icon{font-size:52px;opacity:.4}
.cart-empty-txt{color:var(--muted);font-size:14px}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;background:var(--card);border:1px solid var(--border);border-radius:12px}
.cart-item-img{width:52px;height:52px;border-radius:10px;background:var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}
.cart-item-img img{width:100%;height:100%;object-fit:cover}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item-price{font-size:13px;color:var(--primary);font-weight:700;margin-top:2px}
.cart-qty{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qty-btn{width:28px;height:28px;background:rgba(255,255,255,.07);border:none;border-radius:7px;color:var(--text);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.qty-btn:hover{background:rgba(255,255,255,.14)}
.qty-val{font-weight:700;font-size:14px;min-width:20px;text-align:center}
.cart-del{width:28px;height:28px;background:rgba(239,68,68,.1);border:none;border-radius:7px;color:#EF4444;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.cart-del:hover{background:#EF4444;color:#fff}
.totals{display:grid;gap:8px;margin-bottom:14px}
.total-row{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.total-row span:first-child{color:var(--muted)}
.total-row span:last-child{font-weight:600}
.total-final{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--border);margin-top:4px}
.total-final-label{font-family:'Syne',sans-serif;font-weight:800;font-size:16px}
.total-final-val{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;color:var(--primary)}
.btn-full{width:100%;background:var(--primary);border:none;border-radius:var(--radius-sm);padding:14px;color:#fff;font-family:'Syne',sans-serif;font-weight:800;font-size:15px;cursor:pointer;transition:all .2s;box-shadow:0 4px 20px var(--primary-glow);display:flex;align-items:center;justify-content:center;gap:8px}
.btn-full:hover{background:#e04e1f;transform:translateY(-1px)}
.btn-full:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-ghost-sm{background:transparent;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 20px;color:var(--text);font-family:'Syne',sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-ghost-sm:hover{border-color:var(--primary);color:var(--primary)}
.btn-row{display:flex;gap:10px}
.btn-row .btn-ghost-sm{flex:1}
.btn-row .btn-full{flex:2}
.field{display:grid;gap:5px;margin-bottom:14px}
.field label{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:4px}
.field label .req{color:var(--primary);font-weight:700}
.field input,.field select,.field textarea{background:rgba(255,255,255,.05);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;color:var(--text);font-family:'Outfit',sans-serif;font-size:14px;outline:none;transition:border-color .2s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
.field input::placeholder,.field textarea::placeholder{color:var(--muted)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-hint{font-size:11px;color:var(--muted);margin-top:3px}
.autofill-badge{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);border-radius:8px;padding:8px 12px;font-size:12px;color:#4ade80;margin-bottom:14px;display:none}
.steps{display:flex;align-items:center;gap:6px;margin-bottom:22px}
.step-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;color:var(--muted);transition:all .3s;flex-shrink:0}
.step-dot.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 12px var(--primary-glow)}
.step-dot.done{background:#22C55E;border-color:#22C55E;color:#fff}
.step-line{flex:1;height:2px;background:var(--border);border-radius:2px;transition:background .3s}
.step-line.done{background:#22C55E}
.pay-opt{display:flex;align-items:center;gap:12px;padding:13px 16px;margin-bottom:8px;border:1.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .2s}
.pay-opt:hover{border-color:rgba(255,87,34,.3)}
.pay-opt.selected{border-color:var(--primary);background:var(--primary-dim)}
.pay-opt input{accent-color:var(--primary)}
.pay-opt-label{font-size:14px;font-weight:500}
.cep-row{display:flex;gap:8px;align-items:flex-end}
.cep-row input{flex:1}
.btn-cep{background:var(--primary-dim);border:1.5px solid rgba(255,87,34,.3);border-radius:var(--radius-sm);padding:11px 14px;color:var(--primary);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s;font-family:'Syne',sans-serif}
.btn-cep:hover{background:var(--primary);color:#fff}
#track-page{display:none;min-height:100dvh;padding:24px;background:var(--bg)}
.track-wrap{max-width:460px;margin:32px auto}
.track-header{text-align:center;margin-bottom:32px}
.track-anim{font-size:56px;margin-bottom:16px;display:block;animation:float 3s ease-in-out infinite}
.track-title{font-family:'Syne',sans-serif;font-weight:800;font-size:26px;margin-bottom:6px}
.track-sub{color:var(--muted);font-size:13px}
.track-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.track-step{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}
.track-step:last-child{border-bottom:none;padding-bottom:0}
.track-dot{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.track-dot.done{background:rgba(34,197,94,.12);border:2px solid #22C55E}
.track-dot.active{background:var(--primary-dim);border:2px solid var(--primary);animation:pulse-ring 1.8s infinite}
.track-dot.pending{background:rgba(255,255,255,.04);border:2px solid var(--border)}
@keyframes pulse-ring{0%{box-shadow:0 0 0 0 var(--primary-glow)}70%{box-shadow:0 0 0 10px rgba(255,87,34,0)}100%{box-shadow:0 0 0 0 rgba(255,87,34,0)}}
.track-step-title{font-weight:600;font-size:14px;margin-bottom:3px}
.track-step-desc{font-size:12px;color:var(--muted)}
#toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 20px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:10px;box-shadow:0 8px 32px rgba(0,0,0,.6);animation:slideup .3s ease;white-space:nowrap}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.07);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}
#menu-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60dvh;gap:14px;color:var(--muted)}
.summary-box{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:16px;font-size:13px;display:grid;gap:4px;margin-bottom:10px}
.summary-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.summary-row:last-child{border-bottom:none}
.summary-info{background:rgba(255,87,34,.06);border:1px solid rgba(255,87,34,.15);border-radius:var(--radius-sm);padding:12px;font-size:13px;line-height:1.8}
@media(max-width:600px){
  #hdr{padding:0 16px}
  #hero{padding:36px 16px 28px}
  #cat-wrap{padding:0 16px}
  #prod-wrap{padding:20px 16px 140px}
  #prod-grid{grid-template-columns:1fr 1fr}
  .prod-img-wrap{height:140px}
  .prod-body{padding:12px}
  #cart-btn{display:none}
  .field-row{grid-template-columns:1fr}
}
@media(max-width:360px){#prod-grid{grid-template-columns:1fr}}
</style>
</head>

<script>
const{createClient}=supabase;
const db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let S={config:{},categories:[],products:[],cart:[],deliveryFee:0,activeCat:'all',storeEmoji:'📦'};

const fmt=v=>'R$ '+Number(v).toFixed(2).replace('.',',');
const ge=id=>document.getElementById(id);
const effPrice=p=>(p.preco_oferta&&p.preco_oferta>0&&p.preco_oferta<p.preco)?p.preco_oferta:p.preco;

function toast(msg,type='info'){
  const cols={success:'#22C55E',error:'#EF4444',info:'var(--primary)',warn:'#F59E0B'};
  const icons={success:'✅',error:'❌',info:'🔔',warn:'⚠️'};
  const t=document.createElement('div');t.className='toast';
  t.style.borderLeft=`3px solid ${cols[type]}`;
  t.innerHTML=`<span>${icons[type]}</span><span>${msg}</span>`;
  ge('toast-wrap').appendChild(t);setTimeout(()=>t.remove(),3000);
}
function closeModal(){ge('modal-wrap').innerHTML=''}

function applyTheme(cfg){
  if(!cfg)return;
  const r=document.documentElement.style;
  if(cfg.cor_bg)r.setProperty('--bg',cfg.cor_bg);
  if(cfg.cor_surface)r.setProperty('--surface',cfg.cor_surface);
  if(cfg.cor_card)r.setProperty('--card',cfg.cor_card);
  if(cfg.cor_primary){r.setProperty('--primary',cfg.cor_primary);r.setProperty('--primary-glow',cfg.cor_primary+'40')}

// ── CEP ──
async function buscarCEP(cep,logId,bairroId,cidadeId){
  const c=cep.replace(/\D/g,'');
  if(c.length!==8){toast('CEP inválido','warn');return}
  try{
    const r=await fetch(`https://viacep.com.br/ws/${c}/json/`);
    const d=await r.json();
    if(d.erro){toast('CEP não encontrado','warn');return}
    if(logId&&ge(logId))ge(logId).value=d.logradouro||'';
    if(bairroId&&ge(bairroId))ge(bairroId).value=d.bairro||'';
    if(cidadeId&&ge(cidadeId))ge(cidadeId).value=d.localidade&&d.uf?`${d.localidade}/${d.uf}`:'';
    // Montar campo de endereço automaticamente
    const endEl=ge('ck-end');
    if(endEl&&d.logradouro){
      const num=ge('ck-num')?.value||'';
      endEl.value=`${d.logradouro}${num?', '+num:''}, ${d.bairro||''}, ${d.localidade||''}/${d.uf||''}`;
    }
    toast('Endereço preenchido! ✅','success');
  }catch(e){toast('Erro ao buscar CEP','error')}
}

function maskPhone(input){
  let v=input.value.replace(/\D/g,'').slice(0,11);
  if(v.length>10)v=v.replace(/^(\d{2})(\d{5})(\d{4}).*/,'($1) $2-$3');
  else if(v.length>6)v=v.replace(/^(\d{2})(\d{4})(\d*)/,'($1) $2-$3');
  else if(v.length>2)v=v.replace(/^(\d{2})(\d*)/,'($1) $2');
  input.value=v;
}
function maskCEP(input){
  let v=input.value.replace(/\D/g,'').slice(0,8);
  if(v.length>5)v=v.replace(/^(\d{5})(\d)/,'$1-$2');
  input.value=v;
}

// ── BUSCAR CLIENTE POR TELEFONE ──
async function buscarClientePorTelefone(tel){
  const t=tel.replace(/\D/g,'');
  if(t.length<10)return;
  const{data}=await db.from('pedidos').select('cliente_nome,cliente_endereco').eq('cliente_telefone',tel).order('created_at',{ascending:false}).limit(1);
  if(data&&data.length){
    const badge=ge('autofill-badge');
    if(badge){badge.style.display='block';badge.textContent=`✅ Bem-vindo de volta, ${data[0].cliente_nome}! Dados preenchidos automaticamente.`}
    const nomeEl=ge('ck-nome');const endEl=ge('ck-end');
    if(nomeEl&&!nomeEl.value)nomeEl.value=data[0].cliente_nome||'';
    if(endEl&&!endEl.value)endEl.value=data[0].cliente_endereco||'';
  }
}

// ── CARRINHO ──
function addToCart(pid){
  const p=S.products.find(x=>x.id===pid);if(!p)return;
  const ex=S.cart.find(x=>x.id===pid);
  if(ex)ex.qty++;else S.cart.push({...p,qty:1});
  updateFee();updateCartBadge();
  toast(`${p.nome} adicionado! 🛒`,'success');
}
function updateFee(){S.deliveryFee=S.cart.length?Math.max(...S.cart.map(i=>i.taxa_entrega||0),0):0}
function removeFromCart(pid){S.cart=S.cart.filter(x=>x.id!==pid);updateFee();updateCartBadge()}
function changeQty(pid,d){
  const i=S.cart.find(x=>x.id===pid);if(!i)return;
  i.qty+=d;if(i.qty<=0)removeFromCart(pid);else{updateFee();updateCartBadge()}
}
function updateCartBadge(){
  const q=S.cart.reduce((s,i)=>s+i.qty,0);
  const sub=S.cart.reduce((s,i)=>s+(effPrice(i)*i.qty),0);
  ge('cart-count').textContent=q;ge('cart-count').style.display=q?'inline-block':'none';
  const fab=ge('cart-fab-mobile');
  if(fab){ge('cart-count-mob').textContent=q?`${q} iten${q!==1?'s':'m'} · ${fmt(sub+S.deliveryFee)}`:'Ver Carrinho';fab.classList.toggle('visible',q>0)}
}

        </div>

function buildCartItems(){
  if(!S.cart.length)return`<div class="cart-empty-state"><span class="cart-empty-icon">🛒</span><p class="cart-empty-txt">Carrinho vazio.<br>Escolha algo delicioso!</p></div>`;

function refreshCart(){

  const tv=ge('cart-total-val');if(tv)tv.textContent=fmt(total);

function selPay(idx,val){
  document.querySelectorAll('.pay-opt').forEach(o=>o.classList.remove('selected'));
  ge(`popt${idx}`)?.classList.add('selected');
  const pr=ge(`pr${idx}`);if(pr)pr.checked=true;
  const tf=ge('troco-f');if(tf)tf.style.display=val.includes('Dinheiro')?'grid':'none';
}

function ckStep(to){
  if(to===2){
    if(!ge('ck-tel')?.value.trim()){toast('WhatsApp é obrigatório','warn');ge('ck-tel')?.focus();return}
    if(!ge('ck-nome')?.value.trim()){toast('Digite seu nome','warn');ge('ck-nome')?.focus();return}
    if(!ge('ck-end')?.value.trim()){toast('Digite o endereço','warn');ge('ck-end')?.focus();return}
  }
  if(to===3)buildSummary();
  _step=to;
  [1,2,3].forEach(n=>{
    const s=ge(`ck-s${n}`);if(s)s.style.display=n===to?'block':'none';
    const d=ge(`sd${n}`);
    if(d){d.classList.toggle('active',n===to);d.classList.toggle('done',n<to)}
    if(n<3){const l=ge(`sl${n}`);if(l)l.classList.toggle('done',n<to)}
  });
  const back=ge('ck-back');const next=ge('ck-next');
  if(back)back.style.display=to>1?'flex':'none';
  if(next){
    if(to===1){next.textContent='Continuar →';next.onclick=()=>ckStep(2)}
    else if(to===2){next.textContent='Revisar →';next.onclick=()=>ckStep(3)}
    else{next.textContent='✅ Confirmar Pedido';next.onclick=placeOrder}
  }
}

function buildSummary(){
  const sub=S.cart.reduce((s,i)=>s+(effPrice(i)*i.qty),0);
  const total=sub+S.deliveryFee;
  const pgto=document.querySelector('input[name="pgto"]:checked')?.value||'Dinheiro';
  const area=ge('ck-sum');if(!area)return;
  area.innerHTML=`
    <div class="summary-box">
      ${S.cart.map(i=>`<div class="summary-row"><span style="color:var(--muted)">${i.qty}× ${i.nome}</span><span style="font-weight:600">${fmt(effPrice(i)*i.qty)}</span></div>`).join('')}
      <div class="summary-row"><span style="color:var(--muted)">Subtotal</span><span>${fmt(sub)}</span></div>
      <div class="summary-row"><span style="color:var(--muted)">Entrega</span><span>${S.deliveryFee>0?fmt(S.deliveryFee):'Grátis'}</span></div>
      <div class="summary-row" style="font-family:'Syne',sans-serif;font-weight:800;font-size:16px;padding-top:8px">
        <span>Total</span><span style="color:var(--primary)">${fmt(total)}</span>
      </div>
    </div>
    <div class="summary-info">
      📱 <strong>${ge('ck-tel').value}</strong><br>
      👤 ${ge('ck-nome').value}<br>
      📍 ${ge('ck-end').value}${ge('ck-comp')?.value?' — '+ge('ck-comp').value:''}<br>
      💳 ${pgto}${ge('ck-obs')?.value?`<br>📝 ${ge('ck-obs').value}`:''}
    </div>`;

async function placeOrder(){
  const btn=ge('ck-next');if(btn){btn.disabled=true;btn.textContent='⏳ Enviando...'}
  const sub=S.cart.reduce((s,i)=>s+(effPrice(i)*i.qty),0);
  const total=sub+S.deliveryFee;
  const pgto=document.querySelector('input[name="pgto"]:checked')?.value||'Dinheiro';
  const telRaw=ge('ck-tel')?.value||'';
  const payload={
    cliente_nome:ge('ck-nome').value,
    cliente_endereco:ge('ck-end').value+(ge('ck-comp')?.value?' - '+ge('ck-comp').value:''),
    cliente_telefone:telRaw,
    pagamento:pgto,
    troco:parseFloat(ge('ck-troco')?.value)||null,
    observacoes:ge('ck-obs')?.value||'',
    itens:JSON.stringify(S.cart.map(i=>({id:i.id,nome:i.nome,preco:effPrice(i),qty:i.qty}))),
    subtotal:sub,taxa_entrega:S.deliveryFee,total,status:'recebido'
  };
  const{data,error}=await db.from('pedidos').insert(payload).select().single();
  if(error){toast('Erro: '+error.message,'error');if(btn){btn.disabled=false;btn.textContent='✅ Confirmar Pedido'}return}
  const wpp=(S.config.whatsapp||'').replace(/\D/g,'');
  const msg=`🛵 *NOVO PEDIDO #${data.id}*\n\n📱 *${telRaw}*\n👤 *${payload.cliente_nome}*\n📍 ${payload.cliente_endereco}\n`+
    `\n🛒 *Itens:*\n`+S.cart.map(i=>`• ${i.qty}× ${i.nome} — ${fmt(effPrice(i)*i.qty)}`).join('\n')+
    `\n\n💰 Subtotal: ${fmt(sub)}\n🚚 Entrega: ${S.deliveryFee>0?fmt(S.deliveryFee):'Grátis'}`+
    `\n💵 *TOTAL: ${fmt(total)}*\n💳 ${pgto}`+
    (payload.troco?`\n🔄 Troco: ${fmt(payload.troco)}`:'')+
    (payload.observacoes?`\n📝 ${payload.observacoes}`:'')+
    `\n\n🔗 Acompanhe: ${location.origin+location.pathname}?track=${data.id}`;
  S.cart=[];S.deliveryFee=0;updateCartBadge();closeModal();
  if(wpp)setTimeout(()=>window.open(`https://wa.me/${wpp}?text=${encodeURIComponent(msg)}`,'_blank'),400);
  setTimeout(()=>showTrack(data.id),600);
  toast('Pedido enviado! 🎉','success');
}

const STEPS=[
  {key:'recebido',label:'Pedido Recebido',icon:'📥',desc:'Recebido pela loja'},
  {key:'aceito',label:'Pedido Aceito',icon:'✅',desc:'A loja confirmou seu pedido'},
  {key:'preparando',label:'Em Preparo',icon:'👨‍🍳',desc:'Preparando com carinho'},
  {key:'entrega',label:'Saiu para Entrega',icon:'🛵',desc:'A caminho de você!'},
  {key:'finalizado',label:'Entregue!',icon:'🎉',desc:'Bom apetite! 😋'},
];
let trackSub=null;
async function showTrack(id){
  ge('menu-page').style.display='none';ge('track-page').style.display='block';
  ge('track-label').textContent=`Pedido #${id}`;
  const{data}=await db.from('pedidos').select('*').eq('id',id).single();
  if(data)renderTrack(data);
  if(trackSub)trackSub.unsubscribe();
  trackSub=db.channel(`track-${id}`)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'pedidos',filter:`id=eq.${id}`},p=>renderTrack(p.new))
    .subscribe();
}
function renderTrack(o){
  const idx=STEPS.findIndex(s=>s.key===o.status);
  ge('track-steps').innerHTML=STEPS.map((s,i)=>{
    const done=i<idx,active=i===idx;
    return`<div class="track-step">
      <div class="track-dot ${done?'done':active?'active':'pending'}">${done?'✓':s.icon}</div>
      <div><div class="track-step-title" style="color:${active?'var(--primary)':done?'#22C55E':'var(--muted)'}">${s.label}</div>
      <div class="track-step-desc">${s.desc}</div></div>
    </div>`;
  }).join('');
  const itens=JSON.parse(o.itens||'[]');
  const sum=ge('track-summary');sum.style.display='block';
  sum.innerHTML=`<p style="font-family:'Syne',sans-serif;font-weight:700;margin-bottom:12px;font-size:14px">Resumo</p>`+
    itens.map(i=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border)"><span style="color:var(--muted)">${i.qty}× ${i.nome}</span><span>${fmt(i.preco*i.qty)}</span></div>`).join('')+
    `<div style="display:flex;justify-content:space-between;font-family:'Syne',sans-serif;font-weight:800;font-size:16px;padding-top:12px;border-top:1px solid var(--border);margin-top:6px"><span>Total</span><span style="color:var(--primary)">${fmt(o.total)}</span></div>`;
}

async function init(){
  const params=new URLSearchParams(location.search);
  const trackId=params.get('track');
  if(trackId){showTrack(parseInt(trackId));return}
  loadMenu();
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
