<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cardápio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0B0C0E;
  --surface:#13151A;
  --card:#1C1F27;
  --card2:#242830;
  --border:rgba(255,255,255,.08);
  --border2:rgba(255,255,255,.05);
  --primary:#6C63FF;
  --primary-hover:#5A52E0;
  --primary-glow:rgba(108,99,255,.3);
  --primary-dim:rgba(108,99,255,.12);
  --accent:#FF6B6B;
  --accent2:#FFD93D;
  --green:#4ADE80;
  --text:#F1F2F6;
  --text2:#C8CACC;
  --muted:#6B7280;
  --radius:18px;
  --radius-sm:12px;
  --radius-xs:8px;
  --shadow:0 8px 32px rgba(0,0,0,.4);
  --shadow-lg:0 20px 60px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--card2);border-radius:4px}

/* HEADER */
#hdr{
  position:sticky;top:0;z-index:90;
  background:rgba(11,12,14,.94);
  backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border2);
  padding:0 24px;height:66px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
#hdr-logo{display:flex;align-items:center;gap:12px;min-width:0}
#hdr-icon{width:38px;height:38px;border-radius:11px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;box-shadow:0 4px 16px var(--primary-glow)}
#hdr-name{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
#cart-btn{
  background:var(--primary);border:none;border-radius:var(--radius-sm);
  padding:10px 20px;color:#fff;font-weight:700;font-size:13px;
  cursor:pointer;display:flex;align-items:center;gap:8px;flex-shrink:0;
  box-shadow:0 4px 20px var(--primary-glow);transition:all .2s;
  font-family:'Plus Jakarta Sans',sans-serif;
}
#cart-btn:hover{background:var(--primary-hover);transform:translateY(-1px);box-shadow:0 8px 28px var(--primary-glow)}
#cart-count{background:#fff;color:var(--primary);font-size:10px;font-weight:900;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center;display:none}

/* HERO */
#hero{
  padding:52px 24px 40px;text-align:center;position:relative;overflow:hidden;
}
#hero::before{
  content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%);
  width:700px;height:400px;
  background:radial-gradient(ellipse,rgba(108,99,255,.15) 0%,rgba(255,107,107,.08) 50%,transparent 70%);
  pointer-events:none;border-radius:50%;
}
#hero-emoji{font-size:58px;margin-bottom:14px;display:block;animation:float 3.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#hero h1{font-size:clamp(26px,5.5vw,50px);font-weight:800;letter-spacing:-.03em;line-height:1.08;margin-bottom:10px;position:relative;background:linear-gradient(135deg,var(--text) 0%,rgba(241,242,246,.7) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#hero-desc{color:var(--muted);font-size:15px;position:relative;margin-bottom:22px;font-weight:500}
.hero-pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hero-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:6px 16px;font-size:12px;font-weight:600;color:var(--text2)}

/* CATEGORY BAR */
#cat-wrap{
  position:sticky;top:66px;z-index:80;
  background:rgba(11,12,14,.96);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border2);padding:0 24px;
}
#cat-bar{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
#cat-bar::-webkit-scrollbar{display:none}
.cat-pill{
  flex-shrink:0;display:flex;align-items:center;gap:7px;
  padding:9px 20px;border-radius:999px;
  border:1.5px solid var(--border);background:transparent;
  color:var(--muted);cursor:pointer;
  font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:12.5px;
  transition:all .22s;white-space:nowrap;
}
.cat-pill:hover{border-color:rgba(108,99,255,.4);color:var(--text);background:rgba(108,99,255,.06)}
.cat-pill.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 16px var(--primary-glow)}

/* PRODUCTS */
#prod-wrap{padding:30px 24px 150px}
.section-label{
  font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin:0 0 20px;
  display:flex;align-items:center;gap:12px;
}
.section-label::after{content:'';flex:1;height:1px;background:var(--border2)}

#prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}

/* PRODUCT CARD */
.prod-card{
  background:var(--card);border:1px solid var(--border2);
  border-radius:var(--radius);overflow:hidden;cursor:pointer;
  transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;
}
.prod-card:hover{
  transform:translateY(-8px);
  border-color:rgba(108,99,255,.35);
  box-shadow:0 24px 64px rgba(0,0,0,.7),0 0 0 1px rgba(108,99,255,.2);
}
.prod-img-wrap{width:100%;height:190px;position:relative;overflow:hidden;background:var(--card2)}
.prod-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.prod-card:hover .prod-img-wrap img{transform:scale(1.1)}
.prod-img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:56px;background:linear-gradient(135deg,#1a1c24,#242830)}
.prod-img-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88) 0%,rgba(0,0,0,.05) 55%,transparent 100%)}
.prod-badges{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}
.prod-badge-offer{background:var(--accent2);color:#111;font-weight:800;font-size:10px;padding:4px 10px;border-radius:999px;letter-spacing:.02em}
.prod-badge-dest{background:rgba(255,255,255,.18);backdrop-filter:blur(8px);color:#fff;font-weight:700;font-size:10px;padding:4px 10px;border-radius:999px}
.prod-price-area{position:absolute;bottom:14px;right:14px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.prod-price-old{font-size:11px;font-weight:600;color:rgba(255,255,255,.45);text-decoration:line-through}
.prod-price-new{background:var(--primary);color:#fff;font-weight:800;font-size:14px;padding:5px 14px;border-radius:999px;box-shadow:0 4px 14px var(--primary-glow)}
.prod-body{padding:18px}
.prod-name{font-weight:700;font-size:15.5px;margin-bottom:7px;letter-spacing:-.01em;color:var(--text)}
.prod-desc{color:var(--muted);font-size:12.5px;line-height:1.65;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:400}
.prod-footer{display:flex;align-items:center;justify-content:space-between;gap:8px}
.prod-delivery{font-size:11.5px;color:var(--muted);font-weight:500}
.prod-delivery.free{color:var(--green);font-weight:600}
.prod-add-btn{
  background:var(--primary-dim);border:1.5px solid rgba(108,99,255,.25);
  border-radius:var(--radius-xs);padding:8px 16px;
  color:var(--primary);font-weight:700;font-size:12px;cursor:pointer;
  transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif;white-space:nowrap;
}
.prod-add-btn:hover{background:var(--primary);color:#fff;box-shadow:0 4px 14px var(--primary-glow);border-color:var(--primary)}

/* FAB MOBILE */
#cart-fab-mobile{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  z-index:200;background:var(--primary);border:none;border-radius:999px;
  padding:15px 30px;color:#fff;font-weight:800;font-size:14px;
  cursor:pointer;box-shadow:0 8px 32px var(--primary-glow);
  align-items:center;gap:10px;transition:all .25s;white-space:nowrap;
  display:none;font-family:'Plus Jakarta Sans',sans-serif;
}
#cart-fab-mobile.visible{display:flex}
#cart-fab-mobile:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 12px 40px var(--primary-glow)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:500;padding:16px;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal-box{
  background:var(--surface);border:1px solid var(--border);
  border-radius:22px;width:100%;max-width:540px;
  max-height:92dvh;overflow-y:auto;
  display:flex;flex-direction:column;
  animation:slideup .28s cubic-bezier(.4,0,.2,1);
  box-shadow:var(--shadow-lg);
}
@keyframes slideup{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
.modal-head{
  padding:22px 26px;border-bottom:1px solid var(--border2);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:var(--surface);
  border-radius:22px 22px 0 0;z-index:1;
}
.modal-title{font-weight:800;font-size:19px;letter-spacing:-.02em}
.modal-close{
  width:34px;height:34px;background:var(--card);border:none;
  border-radius:10px;color:var(--muted);cursor:pointer;font-size:14px;
  transition:all .15s;display:flex;align-items:center;justify-content:center;
}
.modal-close:hover{background:var(--card2);color:var(--text)}
.modal-body{padding:22px 26px;flex:1}
.modal-foot{
  padding:18px 26px;border-top:1px solid var(--border2);
  position:sticky;bottom:0;background:var(--surface);
  border-radius:0 0 22px 22px;
}

/* CART */
.cart-empty-state{text-align:center;padding:52px 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.cart-empty-icon{font-size:56px;opacity:.35}
.cart-empty-txt{color:var(--muted);font-size:14px;font-weight:500}
.cart-item{
  display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:10px;
  background:var(--card);border:1px solid var(--border2);border-radius:14px;
  transition:border-color .2s;
}
.cart-item:hover{border-color:rgba(108,99,255,.2)}
.cart-item-img{width:54px;height:54px;border-radius:11px;background:var(--card2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}
.cart-item-img img{width:100%;height:100%;object-fit:cover}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.cart-item-price{font-size:13px;color:var(--primary);font-weight:700;margin-top:3px}
.cart-qty{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qty-btn{width:30px;height:30px;background:var(--card2);border:none;border-radius:8px;color:var(--text);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s;font-weight:600}
.qty-btn:hover{background:var(--primary);color:#fff}
.qty-val{font-weight:800;font-size:14px;min-width:22px;text-align:center;color:var(--text)}
.cart-del{width:30px;height:30px;background:rgba(255,107,107,.1);border:none;border-radius:8px;color:var(--accent);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cart-del:hover{background:var(--accent);color:#fff}

/* TOTALS */
.totals{display:grid;gap:9px;margin-bottom:16px}
.total-row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px}
.total-row span:first-child{color:var(--muted);font-weight:500}
.total-row span:last-child{font-weight:600;color:var(--text2)}
.total-final{display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid var(--border);margin-top:6px}
.total-final-label{font-weight:800;font-size:17px;color:var(--text)}
.total-final-val{font-weight:800;font-size:26px;color:var(--primary)}

/* BUTTONS */
.btn-full{
  width:100%;background:var(--primary);border:none;border-radius:var(--radius-sm);
  padding:15px;color:#fff;font-weight:800;font-size:15px;cursor:pointer;
  transition:all .22s;box-shadow:0 4px 20px var(--primary-glow);
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-.01em;
}
.btn-full:hover{background:var(--primary-hover);transform:translateY(-1px);box-shadow:0 8px 28px var(--primary-glow)}
.btn-full:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-ghost{
  background:transparent;border:1.5px solid var(--border);
  border-radius:var(--radius-sm);padding:13px 20px;color:var(--text2);
  font-weight:600;font-size:14px;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:'Plus Jakarta Sans',sans-serif;
}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-dim)}
.btn-row{display:flex;gap:10px}
.btn-row .btn-ghost{flex:1}
.btn-row .btn-full{flex:2}

/* FORM */
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{font-size:12.5px;color:var(--text2);font-weight:600;display:flex;align-items:center;gap:4px}
.req{color:var(--accent);font-weight:800}
.field input,.field select,.field textarea{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:var(--radius-sm);padding:12px 16px;color:var(--text);
  font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;
  outline:none;transition:all .22s;width:100%;font-weight:500;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);background:rgba(108,99,255,.06);box-shadow:0 0 0 3px rgba(108,99,255,.12)}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);font-weight:400}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-hint{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:400}
.autofill-badge{
  background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.25);
  border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--green);
  margin-bottom:16px;display:none;font-weight:600;
}

/* STEPS */
.steps{display:flex;align-items:center;gap:6px;margin-bottom:24px}
.step-dot{
  width:32px;height:32px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:12px;color:var(--muted);transition:all .3s;flex-shrink:0;
}
.step-dot.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 12px var(--primary-glow)}
.step-dot.done{background:var(--green);border-color:var(--green);color:#fff}
.step-line{flex:1;height:2px;background:var(--border);border-radius:2px;transition:background .3s}
.step-line.done{background:var(--green)}

/* PAGAMENTO */
.pay-opt{
  display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:8px;
  border:1.5px solid var(--border);border-radius:var(--radius-sm);
  cursor:pointer;transition:all .22s;
}
.pay-opt:hover{border-color:rgba(108,99,255,.3);background:rgba(108,99,255,.04)}
.pay-opt.selected{border-color:var(--primary);background:var(--primary-dim)}
.pay-opt input{accent-color:var(--primary)}
.pay-opt-label{font-size:14px;font-weight:600;color:var(--text)}

/* CEP */
.cep-row{display:flex;gap:8px;align-items:flex-end}
.cep-row input{flex:1}
.btn-cep{
  background:var(--primary-dim);border:1.5px solid rgba(108,99,255,.3);
  border-radius:var(--radius-sm);padding:12px 16px;
  color:var(--primary);font-size:13px;font-weight:700;cursor:pointer;
  white-space:nowrap;transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif;
  flex-shrink:0;
}
.btn-cep:hover{background:var(--primary);color:#fff}

/* DIVIDER */
.or-divider{display:flex;align-items:center;gap:10px;margin:4px 0 12px;color:var(--muted);font-size:12px;font-weight:500}
.or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* TRACK */
#track-page{display:none;min-height:100dvh;padding:24px;background:var(--bg)}
.track-wrap{max-width:480px;margin:32px auto}
.track-header{text-align:center;margin-bottom:34px}
.track-anim{font-size:60px;margin-bottom:14px;display:block;animation:float 3.5s ease-in-out infinite}
.track-title{font-weight:800;font-size:28px;margin-bottom:8px;letter-spacing:-.03em;color:var(--text)}
.track-sub{color:var(--muted);font-size:14px;font-weight:500}
.track-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px}
.track-step{display:flex;align-items:flex-start;gap:16px;padding:16px 0;border-bottom:1px solid var(--border2)}
.track-step:last-child{border-bottom:none;padding-bottom:0}
.track-dot{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.track-dot.done{background:rgba(74,222,128,.12);border:2px solid var(--green)}
.track-dot.active{background:var(--primary-dim);border:2px solid var(--primary);animation:pulse-ring 1.8s infinite}
.track-dot.pending{background:rgba(255,255,255,.04);border:2px solid var(--border)}
@keyframes pulse-ring{0%{box-shadow:0 0 0 0 var(--primary-glow)}70%{box-shadow:0 0 0 12px rgba(108,99,255,0)}100%{box-shadow:0 0 0 0 rgba(108,99,255,0)}}
.track-step-title{font-weight:700;font-size:14.5px;margin-bottom:4px;color:var(--text)}
.track-step-desc{font-size:12.5px;color:var(--muted);font-weight:400}

/* TOAST */
#toast-wrap{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:13px 22px;font-size:14px;font-weight:600;
  display:flex;align-items:center;gap:10px;
  box-shadow:var(--shadow);animation:slideup .3s ease;white-space:nowrap;color:var(--text);
}

/* LOADER */
.spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,.07);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}
#menu-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60dvh;gap:16px;color:var(--muted)}

/* SUMMARY */
.summary-box{background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:18px;font-size:13.5px;display:grid;gap:4px;margin-bottom:12px}
.summary-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border2);color:var(--text2)}
.summary-row:last-child{border-bottom:none;font-weight:800;font-size:16px;color:var(--text);padding-top:10px}
.summary-info{background:rgba(108,99,255,.07);border:1px solid rgba(108,99,255,.15);border-radius:var(--radius-sm);padding:14px;font-size:13px;line-height:1.9;color:var(--text2)}

@media(max-width:600px){
  #hdr{padding:0 16px}
  #hero{padding:36px 16px 28px}
  #cat-wrap{padding:0 16px}
  #prod-wrap{padding:20px 16px 150px}
  #prod-grid{grid-template-columns:1fr 1fr}
  .prod-img-wrap{height:150px}
  .prod-body{padding:14px}
  .prod-name{font-size:13.5px}
  #cart-btn{display:none}
  .field-row{grid-template-columns:1fr}
  .modal-box{border-radius:18px}
  .modal-head,.modal-body,.modal-foot{padding-left:18px;padding-right:18px}
}
@media(max-width:360px){#prod-grid{grid-template-columns:1fr}}
</style>
</head>

<!-- MENU PAGE -->
<div id="menu-page">
  <header id="hdr">
    <div id="hdr-logo">
      <div id="hdr-icon">🏪</div>
      <span id="hdr-name">Carregando...</span>
    </div>
    <button id="cart-btn" onclick="openCartModal()">🛒 Carrinho <span id="cart-count">0</span></button>
  </header>

  <div id="menu-loader"><div class="spinner"></div><p>Carregando...</p></div>

  <div id="menu-content" style="display:none">
    <div id="hero">
      <span id="hero-emoji">🏪</span>
      <h1 id="hero-name">Nossa Loja</h1>
      <p id="hero-desc">Escolha seus favoritos com facilidade</p>
      <div class="hero-pills">
        <span class="hero-pill">✨ Entrega rápida</span>
        <span class="hero-pill" id="hero-pill-status">🟢 Aberto agora</span>
      </div>
    </div>
    <div id="cat-wrap"><div id="cat-bar"></div></div>
    <div id="prod-wrap"><p class="section-label">Produtos</p><div id="prod-grid"></div></div>
  </div>

  <button id="cart-fab-mobile" onclick="openCartModal()">
    🛒 <span id="cart-count-mob">Ver Carrinho</span>
  </button>
</div>

<!-- TRACK PAGE -->
<div id="track-page">
  <div class="track-wrap">
    <div class="track-header">
      <span class="track-anim">📦</span>
      <h2 class="track-title">Acompanhe seu Pedido</h2>
      <p class="track-sub" id="track-label">Atualização em tempo real</p>
    </div>
    <div class="track-card" id="track-steps"></div>
    <div class="track-card" id="track-summary" style="display:none"></div>
    <div style="text-align:center;margin-top:24px">
      <button class="btn-ghost" style="max-width:280px;margin:auto" onclick="location.href=location.pathname">← Fazer novo pedido</button>
    </div>
  </div>
</div>

<script>
const{createClient}=supabase;
const db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let S={config:{},categories:[],products:[],cart:[],deliveryFee:0,activeCat:'all',storeEmoji:'🏪'};

const fmt=v=>'R$ '+Number(v).toFixed(2).replace('.',',');
const ge=id=>document.getElementById(id);
const effPrice=p=>(p.preco_oferta&&p.preco_oferta>0&&p.preco_oferta<p.preco)?p.preco_oferta:p.preco;

function toast(msg,type='info'){
  const cols={success:'var(--green)',error:'var(--accent)',info:'var(--primary)',warn:'var(--accent2)'};
  const icons={success:'✅',error:'❌',info:'ℹ️',warn:'⚠️'};
  const t=document.createElement('div');t.className='toast';
  t.style.borderLeft=`3px solid ${cols[type]}`;
  t.innerHTML=`<span>${icons[type]}</span><span>${msg}</span>`;
  ge('toast-wrap').appendChild(t);setTimeout(()=>t.remove(),3000);
}
function closeModal(){ge('modal-wrap').innerHTML=''}
function applyTheme(cfg){
  if(!cfg)return;const r=document.documentElement.style;
  if(cfg.cor_bg)r.setProperty('--bg',cfg.cor_bg);
  if(cfg.cor_surface)r.setProperty('--surface',cfg.cor_surface);
  if(cfg.cor_card)r.setProperty('--card',cfg.cor_card);
  if(cfg.cor_primary){r.setProperty('--primary',cfg.cor_primary);r.setProperty('--primary-glow',cfg.cor_primary+'40')}
  if(cfg.cor_accent)r.setProperty('--accent',cfg.cor_accent);
  if(cfg.cor_text)r.setProperty('--text',cfg.cor_text);
  if(cfg.cor_muted)r.setProperty('--muted',cfg.cor_muted);
}

// MASKS
function maskPhone(el){
  let v=el.value.replace(/\D/g,'').slice(0,11);
  if(v.length>10)v=v.replace(/^(\d{2})(\d{5})(\d{4}).*/,'($1) $2-$3');
  else if(v.length>6)v=v.replace(/^(\d{2})(\d{4})(\d*)/,'($1) $2-$3');
  else if(v.length>2)v=v.replace(/^(\d{2})(\d*)/,'($1) $2');
  el.value=v;
}
function maskCEP(el){
  let v=el.value.replace(/\D/g,'').slice(0,8);
  if(v.length>5)v=v.replace(/^(\d{5})(\d)/,'$1-$2');
  el.value=v;
}

// CEP LOOKUP
async function buscarCEP(){
  const cepEl=ge('ck-cep');if(!cepEl)return;
  const c=cepEl.value.replace(/\D/g,'');
  if(c.length!==8){toast('CEP inválido — digite 8 dígitos','warn');return}
  cepEl.disabled=true;
  try{
    const r=await fetch(`https://viacep.com.br/ws/${c}/json/`);
    const d=await r.json();
    if(d.erro){toast('CEP não encontrado','warn');cepEl.disabled=false;return}
    const endEl=ge('ck-end');const bairroEl=ge('ck-bairro');const cidEl=ge('ck-cidade');
    if(endEl)endEl.value=d.logradouro||'';
    if(bairroEl)bairroEl.value=d.bairro||'';
    if(cidEl)cidEl.value=d.localidade&&d.uf?`${d.localidade} / ${d.uf}`:'';
    ge('ck-num')?.focus();
    toast('Endereço preenchido! Digite o número ↓','success');
  }catch(e){toast('Erro ao buscar CEP','error')}
  cepEl.disabled=false;
}

// BUSCAR CLIENTE POR TELEFONE
async function buscarCliente(){
  const tel=ge('ck-tel')?.value;if(!tel||tel.replace(/\D/g,'').length<10)return;
  const{data}=await db.from('pedidos').select('cliente_nome,cliente_endereco,cliente_telefone').eq('cliente_telefone',tel).order('created_at',{ascending:false}).limit(1);
  if(data&&data.length){
    const o=data[0];
    const badge=ge('autofill-badge');
    if(badge){badge.style.display='block';badge.innerHTML=`👋 Bem-vindo de volta! Dados preenchidos automaticamente.`}
    // Preencher nome
    const nEl=ge('ck-nome');if(nEl&&!nEl.value)nEl.value=o.cliente_nome||'';
    // Preencher endereço completo
    const eEl=ge('ck-end');if(eEl&&!eEl.value&&o.cliente_endereco)eEl.value=o.cliente_endereco;
  }
}

// CART
function addToCart(pid){
  const p=S.products.find(x=>x.id===pid);if(!p)return;
  const ex=S.cart.find(x=>x.id===pid);
  if(ex)ex.qty++;else S.cart.push({...p,qty:1});
  updateFee();updateCartBadge();
  toast(`${p.nome} adicionado!`,'success');
}
function updateFee(){S.deliveryFee=S.cart.length?Math.max(...S.cart.map(i=>i.taxa_entrega||0),0):0}
function removeFromCart(pid){S.cart=S.cart.filter(x=>x.id!==pid);updateFee();updateCartBadge()}
function changeQty(pid,d){
  const i=S.cart.find(x=>x.id===pid);if(!i)return;
  i.qty+=d;if(i.qty<=0)removeFromCart(pid);else{updateFee();updateCartBadge()}
}
function updateCartBadge(){
  const q=S.cart.reduce((s,i)=>s+i.qty,0);
  const sub=S.cart.reduce((s,i)=>s+(effPrice(i)*i.qty),0);
  ge('cart-count').textContent=q;ge('cart-count').style.display=q?'inline-block':'none';
  const fab=ge('cart-fab-mobile');
  if(fab){ge('cart-count-mob').textContent=q?`${q} iten${q!==1?'s':'m'} · ${fmt(sub+S.deliveryFee)}`:'Ver Carrinho';fab.classList.toggle('visible',q>0)}
}

function openCartModal(){
  const q=S.cart.reduce((s,i)=>s+i.qty,0);
  const sub=S.cart.reduce((s,i)=>s+(effPrice(i)*i.qty),0);
  const total=sub+S.deliveryFee;
  ge('modal-wrap').innerHTML=`
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-head">
        <div class="modal-title">🛒 Carrinho${q>0?` <span style="font-size:13px;color:var(--muted);font-weight:500">(${q})</span>`:''}</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="cart-body">${buildCartItems()}</div>
      <div class="modal-foot" id="cart-foot" style="${!q?'display:none':''}">
        <div class="totals">
          <div class="total-row"><span>Subtotal</span><span>${fmt(sub)}</span></div>
          <div class="total-row"><span>Taxa de entrega</span><span id="dval">${S.deliveryFee>0?fmt(S.deliveryFee):'<span style="color:var(--green)">Grátis</span>'}</span></div>
        </div>
        <div class="total-final">
          <span class="total-final-label">Total</span>
          <span class="total-final-val" id="tval">${fmt(total)}</span>
        </div>
        <button class="btn-full" style="margin-top:16px" onclick="openCheckout()">Finalizar Pedido →</button>
      </div>
    </div>
  </div>`;
}

function buildCartItems(){
  if(!S.cart.length)return`<div class="cart-empty-state"><span class="cart-empty-icon">🛒</span><p class="cart-empty-txt">Seu carrinho está vazio.<br>Adicione produtos para continuar!</p></div>`;
  return S.cart.map(i=>`
    <div class="cart-item">
      <div class="cart-item-img">${i.foto_url?`<img src="${i.foto_url}" onerror="this.parentNode.innerHTML='${S.storeEmoji}'">`:`${S.storeEmoji}`}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${i.nome}</div>
        <div class="cart-item-price">${fmt(effPrice(i)*i.qty)}</div>
      </div>
      <div class="cart-qty">
        <button class="qty-btn" onclick="changeQty(${i.id},-1);refreshCart()">−</button>
        <span class="qty-val">${i.qty}</span>
        <button class="qty-btn" onclick="changeQty(${i.id},1);refreshCart()">+</button>
      </div>
      <button class="cart-del" onclick="removeFromCart(${i.id});refreshCart()">✕</button>
    </div>`).join('');
}

function refreshCart(){
  const body=ge('cart-body');if(body)body.innerHTML=buildCartItems();
  const q=S.cart.reduce((s,i)=>s+i.qty,0);
  const sub=S.cart.reduce((s,i)=>s+(effPrice(i)*i.qty),0);
  const total=sub+S.deliveryFee;
  const foot=ge('cart-foot');if(foot)foot.style.display=q?'':'none';
  const tv=ge('tval');if(tv)tv.textContent=fmt(total);
  const dv=ge('dval');if(dv)dv.innerHTML=S.deliveryFee>0?fmt(S.deliveryFee):'<span style="color:var(--green)">Grátis</span>';
}

// CHECKOUT
let _step=1;
function openCheckout(){
  if(!S.cart.length){toast('Adicione itens primeiro','warn');return}
  ge('modal-wrap').innerHTML=`
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-head">
        <div class="modal-title">Finalizar Pedido</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="steps">
          <div class="step-dot active" id="sd1">1</div><div class="step-line" id="sl1"></div>
          <div class="step-dot" id="sd2">2</div><div class="step-line" id="sl2"></div>
          <div class="step-dot" id="sd3">3</div>
        </div>

        <!-- S1 -->
        <div id="ck-s1">
          <div id="autofill-badge" class="autofill-badge"></div>
          <div class="field">
            <label>WhatsApp <span class="req">*</span></label>
            <input id="ck-tel" type="tel" placeholder="(11) 99999-9999" maxlength="15"
              oninput="maskPhone(this)"
              onblur="buscarCliente()"
              onkeydown="if(event.key==='Enter'){event.preventDefault();ge('ck-nome').focus()}"/>
            <span class="field-hint">💡 Se já pediu antes, preenchemos tudo automaticamente!</span>
          </div>
          <div class="field">
            <label>Seu nome <span class="req">*</span></label>
            <input id="ck-nome" placeholder="Ex: Maria da Silva" autocomplete="name"
              onkeydown="if(event.key==='Enter'){event.preventDefault();ge('ck-cep').focus()}"/>
          </div>
          <div style="background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:16px;margin-bottom:16px">
            <p style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em">📍 Endereço de Entrega</p>
            <div class="field" style="margin-bottom:10px">
              <label>Buscar pelo CEP</label>
              <div class="cep-row">
                <input id="ck-cep" placeholder="00000-000" maxlength="9" oninput="maskCEP(this)"
                  onkeydown="if(event.key==='Enter'){event.preventDefault();buscarCEP()}"/>
                <button class="btn-cep" onclick="buscarCEP()">🔍 Buscar</button>
              </div>
              <span class="field-hint">Não sabe o CEP? Preencha o endereço abaixo manualmente.</span>
            </div>
            <div class="or-divider">ou preencha manualmente</div>
            <div class="field" style="margin-bottom:10px">
              <label>Rua / Logradouro <span class="req">*</span></label>
              <input id="ck-end" placeholder="Ex: Rua das Flores"
                onkeydown="if(event.key==='Enter'){event.preventDefault();ge('ck-num').focus()}"/>
            </div>
            <div class="field-row">
              <div class="field" style="margin-bottom:10px">
                <label>Número <span class="req">*</span></label>
                <input id="ck-num" placeholder="Ex: 123"
                  onkeydown="if(event.key==='Enter'){event.preventDefault();ge('ck-bairro').focus()}"/>
              </div>
              <div class="field" style="margin-bottom:10px">
                <label>Bairro</label>
                <input id="ck-bairro" placeholder="Ex: Centro"
                  onkeydown="if(event.key==='Enter'){event.preventDefault();ge('ck-cidade').focus()}"/>
              </div>
            </div>
            <div class="field-row">
              <div class="field" style="margin-bottom:0">
                <label>Cidade / UF</label>
                <input id="ck-cidade" placeholder="Ex: São Paulo / SP"
                  onkeydown="if(event.key==='Enter'){event.preventDefault();ge('ck-comp').focus()}"/>
              </div>
              <div class="field" style="margin-bottom:0">
                <label>Complemento</label>
                <input id="ck-comp" placeholder="Apto, bloco..."
                  onkeydown="if(event.key==='Enter'){event.preventDefault();ckStep(2)}"/>
              </div>
            </div>
          </div>
        </div>

        <!-- S2 -->
        <div id="ck-s2" style="display:none">
          <p style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px">💳 Forma de Pagamento</p>
          ${['💵 Dinheiro','💳 Cartão de Débito','💳 Cartão de Crédito','🏦 PIX'].map((m,i)=>`
          <div class="pay-opt${i===0?' selected':''}" id="popt${i}" onclick="selPay(${i},'${m}')">
            <input type="radio" name="pgto" value="${m}" ${i===0?'checked':''} style="accent-color:var(--primary)"/>
            <span class="pay-opt-label">${m}</span>
          </div>`).join('')}
          <div id="troco-f" class="field" style="margin-top:6px">
            <label>Troco para (R$)</label>
            <input id="ck-troco" type="number" placeholder="Ex: 50,00"
              onkeydown="if(event.key==='Enter'){event.preventDefault();ge('ck-obs').focus()}"/>
          </div>
          <div class="field">
            <label>Observações (opcional)</label>
            <textarea id="ck-obs" rows="2" placeholder="Ex: Sem cebola, molho à parte, toque o interfone..."></textarea>
          </div>
        </div>

        <!-- S3 -->
        <div id="ck-s3" style="display:none"><div id="ck-sum"></div></div>
      </div>
      <div class="modal-foot">
        <div class="btn-row">
          <button class="btn-ghost" id="ck-back" style="display:none" onclick="ckStep(_step-1)">← Voltar</button>
          <button class="btn-full" id="ck-next" onclick="ckStep(2)">Continuar →</button>
        </div>
      </div>
    </div>
  </div>`;
  _step=1;
  setTimeout(()=>ge('ck-tel')?.focus(),100);
}

function selPay(idx,val){
  document.querySelectorAll('.pay-opt').forEach(o=>o.classList.remove('selected'));
  ge(`popt${idx}`)?.classList.add('selected');
  const pr=ge(`pr${idx}`);if(pr)pr.checked=true;
  const tf=ge('troco-f');if(tf)tf.style.display=val.includes('Dinheiro')?'grid':'none';
}

function getMontaEndereco(){
  const rua=ge('ck-end')?.value.trim()||'';
  const num=ge('ck-num')?.value.trim()||'';
  const bairro=ge('ck-bairro')?.value.trim()||'';
  const cidade=ge('ck-cidade')?.value.trim()||'';
  const comp=ge('ck-comp')?.value.trim()||'';
  let end=rua;
  if(num)end+=`, ${num}`;
  if(bairro)end+=`, ${bairro}`;
  if(cidade)end+=` — ${cidade}`;
  if(comp)end+=` (${comp})`;
  return end;
}

function ckStep(to){
  if(to===2){
    if(!ge('ck-tel')?.value.trim()){toast('Digite seu WhatsApp','warn');ge('ck-tel')?.focus();return}
    if(!ge('ck-nome')?.value.trim()){toast('Digite seu nome','warn');ge('ck-nome')?.focus();return}
    if(!ge('ck-end')?.value.trim()){toast('Digite a rua/endereço','warn');ge('ck-end')?.focus();return}
    if(!ge('ck-num')?.value.trim()){toast('Digite o número','warn');ge('ck-num')?.focus();return}
  }
  if(to===3)buildSummary();
  _step=to;
  [1,2,3].forEach(n=>{
    const s=ge(`ck-s${n}`);if(s)s.style.display=n===to?'block':'none';
    const d=ge(`sd${n}`);if(d){d.classList.toggle('active',n===to);d.classList.toggle('done',n<to)}
    if(n<3){const l=ge(`sl${n}`);if(l)l.classList.toggle('done',n<to)}
  });
  const back=ge('ck-back');const next=ge('ck-next');
  if(back)back.style.display=to>1?'flex':'none';
  if(next){
    if(to===1){next.textContent='Continuar →';next.onclick=()=>ckStep(2)}
    else if(to===2){next.textContent='Revisar pedido →';next.onclick=()=>ckStep(3)}
    else{next.textContent='✅ Confirmar Pedido';next.onclick=placeOrder}
  }
}

function buildSummary(){
  const sub=S.cart.reduce((s,i)=>s+(effPrice(i)*i.qty),0);
  const total=sub+S.deliveryFee;
  const pgto=document.querySelector('input[name="pgto"]:checked')?.value||'Dinheiro';
  const end=getMontaEndereco();
  const area=ge('ck-sum');if(!area)return;
  area.innerHTML=`
    <div class="summary-box">
      ${S.cart.map(i=>`<div class="summary-row"><span>${i.qty}× ${i.nome}</span><span style="font-weight:600">${fmt(effPrice(i)*i.qty)}</span></div>`).join('')}
      <div class="summary-row"><span>Subtotal</span><span>${fmt(sub)}</span></div>
      <div class="summary-row"><span>Entrega</span><span>${S.deliveryFee>0?fmt(S.deliveryFee):'Grátis'}</span></div>
      <div class="summary-row"><span>Total</span><span style="color:var(--primary)">${fmt(total)}</span></div>
    </div>
    <div class="summary-info">
      📱 <strong>${ge('ck-tel').value}</strong><br>
      👤 ${ge('ck-nome').value}<br>
      📍 ${end}<br>
      💳 ${pgto}${ge('ck-obs')?.value?`<br>📝 ${ge('ck-obs').value}`:''}
    </div>`;
}

async function placeOrder(){
  const btn=ge('ck-next');if(btn){btn.disabled=true;btn.textContent='⏳ Enviando...'}
  const sub=S.cart.reduce((s,i)=>s+(effPrice(i)*i.qty),0);
  const total=sub+S.deliveryFee;
  const pgto=document.querySelector('input[name="pgto"]:checked')?.value||'Dinheiro';
  const endFull=getMontaEndereco();
  const payload={
    cliente_nome:ge('ck-nome').value,
    cliente_endereco:endFull,
    cliente_telefone:ge('ck-tel').value,
    pagamento:pgto,
    troco:parseFloat(ge('ck-troco')?.value)||null,
    observacoes:ge('ck-obs')?.value||'',
    itens:JSON.stringify(S.cart.map(i=>({id:i.id,nome:i.nome,preco:effPrice(i),qty:i.qty}))),
    subtotal:sub,taxa_entrega:S.deliveryFee,total,status:'recebido'
  };
  const{data,error}=await db.from('pedidos').insert(payload).select().single();
  if(error){toast('Erro: '+error.message,'error');if(btn){btn.disabled=false;btn.textContent='✅ Confirmar Pedido'}return}
  const wpp=(S.config.whatsapp||'').replace(/\D/g,'');
  const msg=`🛵 *NOVO PEDIDO #${data.id}*\n\n📱 *${payload.cliente_telefone}*\n👤 *${payload.cliente_nome}*\n📍 ${payload.cliente_endereco}\n`+
    `\n🛒 *Itens:*\n`+S.cart.map(i=>`• ${i.qty}× ${i.nome} — ${fmt(effPrice(i)*i.qty)}`).join('\n')+
    `\n\n💰 Subtotal: ${fmt(sub)}\n🚚 Entrega: ${S.deliveryFee>0?fmt(S.deliveryFee):'Grátis'}`+
    `\n💵 *TOTAL: ${fmt(total)}*\n💳 ${pgto}`+
    (payload.troco?`\n🔄 Troco: ${fmt(payload.troco)}`:'')+
    (payload.observacoes?`\n📝 ${payload.observacoes}`:'')+
    `\n\n🔗 Acompanhe: ${location.origin+location.pathname}?track=${data.id}`;
  S.cart=[];S.deliveryFee=0;updateCartBadge();closeModal();
  if(wpp)setTimeout(()=>window.open(`https://wa.me/${wpp}?text=${encodeURIComponent(msg)}`,'_blank'),400);
  setTimeout(()=>showTrack(data.id),600);
  toast('Pedido enviado com sucesso! 🎉','success');
}

// MENU
async function loadMenu(){
  ge('menu-loader').style.display='flex';ge('menu-content').style.display='none';
  const{data:cfg}=await db.from('configuracoes').select('*').eq('id',1).single();
  if(cfg){
    S.config=cfg;applyTheme(cfg);
    ge('hdr-name').textContent=cfg.nome_fantasia||'Nossa Loja';
    ge('hero-name').textContent=cfg.nome_fantasia||'Nossa Loja';
    if(cfg.descricao)ge('hero-desc').textContent=cfg.descricao;
    if(cfg.logo_emoji){ge('hdr-icon').textContent=cfg.logo_emoji;ge('hero-emoji').textContent=cfg.logo_emoji;S.storeEmoji=cfg.logo_emoji}
    document.title=cfg.nome_fantasia||'Cardápio';
  }
  const{data:cats}=await db.from('categorias').select('*').order('ordem');
  S.categories=cats||[];
  const{data:prods}=await db.from('produtos').select('*,categorias(nome,icone)').eq('ativo',true).order('nome');
  S.products=prods||[];
  renderCatBar();renderGrid();
  ge('menu-loader').style.display='none';ge('menu-content').style.display='block';
}

function renderCatBar(){
  ge('cat-bar').innerHTML=[{id:'all',nome:'Todos',icone:'✨'},...S.categories].map(c=>`
    <button class="cat-pill${S.activeCat==c.id?' active':''}" onclick="filterCat('${c.id}')">${c.icone||''} ${c.nome}</button>`).join('');
}
function filterCat(id){S.activeCat=id;renderCatBar();renderGrid()}

function renderGrid(){
  const grid=ge('prod-grid');
  const list=S.activeCat==='all'?S.products:S.products.filter(p=>String(p.categoria_id)===String(S.activeCat));
  if(!list.length){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--muted)">Nenhum produto nesta categoria 😔</div>`;return}
  const ho=p=>p.preco_oferta&&p.preco_oferta>0&&p.preco_oferta<p.preco;
  grid.innerHTML=list.map(p=>`
    <div class="prod-card" onclick="addToCart(${p.id})">
      <div class="prod-img-wrap">
        ${p.foto_url?`<img src="${p.foto_url}" alt="${p.nome}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=\\'prod-img-placeholder\\'>${S.storeEmoji}</div>'">`:`<div class="prod-img-placeholder">${S.storeEmoji}</div>`}
        <div class="prod-img-overlay"></div>
        <div class="prod-badges">
          ${ho(p)?`<span class="prod-badge-offer">🔥 OFERTA</span>`:''}
          ${p.destaque_texto?`<span class="prod-badge-dest">${p.destaque_texto}</span>`:''}
        </div>
        <div class="prod-price-area">
          ${ho(p)?`<span class="prod-price-old">${fmt(p.preco)}</span><span class="prod-price-new">${fmt(p.preco_oferta)}</span>`:`<span class="prod-price-new">${fmt(p.preco)}</span>`}
        </div>
      </div>
      <div class="prod-body">
        <div class="prod-name">${p.nome}</div>
        ${p.descricao?`<div class="prod-desc">${p.descricao}</div>`:''}
        <div class="prod-footer">
          <span class="prod-delivery${!p.taxa_entrega?' free':''}">${p.taxa_entrega>0?`🚚 ${fmt(p.taxa_entrega)}`:'🚚 Frete grátis'}</span>
          <button class="prod-add-btn" onclick="event.stopPropagation();addToCart(${p.id})">+ Adicionar</button>
        </div>
      </div>
    </div>`).join('');
}

// TRACKING
const STEPS=[
  {key:'recebido',label:'Pedido Recebido',icon:'📥',desc:'Seu pedido foi recebido'},
  {key:'aceito',label:'Pedido Confirmado',icon:'✅',desc:'A loja confirmou seu pedido'},
  {key:'preparando',label:'Em Preparo',icon:'⚙️',desc:'Estamos preparando com cuidado'},
  {key:'entrega',label:'Saiu para Entrega',icon:'🚚',desc:'Seu pedido está a caminho!'},
  {key:'finalizado',label:'Entregue!',icon:'🎉',desc:'Aproveite! Obrigado pela preferência 😊'},
];
let trackSub=null;
async function showTrack(id){
  ge('menu-page').style.display='none';ge('track-page').style.display='block';
  ge('track-label').textContent=`Pedido #${id}`;
  const{data}=await db.from('pedidos').select('*').eq('id',id).single();
  if(data)renderTrack(data);
  if(trackSub)trackSub.unsubscribe();
  trackSub=db.channel(`track-${id}-${Date.now()}`)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'pedidos',filter:`id=eq.${id}`},p=>renderTrack(p.new))
    .subscribe();
}
function renderTrack(o){
  const idx=STEPS.findIndex(s=>s.key===o.status);
  ge('track-steps').innerHTML=STEPS.map((s,i)=>{
    const done=i<idx,active=i===idx;
    return`<div class="track-step">
      <div class="track-dot ${done?'done':active?'active':'pending'}">${done?'✓':s.icon}</div>
      <div>
        <div class="track-step-title" style="color:${active?'var(--primary)':done?'var(--green)':'var(--muted)'}">${s.label}</div>
        <div class="track-step-desc">${s.desc}</div>
      </div>
    </div>`;
  }).join('');
  const itens=JSON.parse(o.itens||'[]');
  const sum=ge('track-summary');sum.style.display='block';
  sum.innerHTML=`<p style="font-weight:700;margin-bottom:12px;font-size:14px;color:var(--text)">Resumo do pedido</p>`+
    itens.map(i=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--border2);color:var(--text2)"><span>${i.qty}× ${i.nome}</span><span style="font-weight:600">${fmt(i.preco*i.qty)}</span></div>`).join('')+
    `<div style="display:flex;justify-content:space-between;font-weight:800;font-size:17px;padding-top:14px;border-top:1px solid var(--border);margin-top:6px;color:var(--text)"><span>Total</span><span style="color:var(--primary)">${fmt(o.total)}</span></div>`;
}

async function init(){
  const params=new URLSearchParams(location.search);
  const trackId=params.get('track');
  if(trackId){showTrack(parseInt(trackId));return}
  loadMenu();
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
